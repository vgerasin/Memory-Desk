name: Интервью
description: Вопросы и ответы, яркие цитаты и ключевые факты. Решения и задачи не выделяются.
record_types: [interview]
focus: Это интервью, а не совещание. Решения и задачи не выдумывай; важны вопросы с ответами, цитаты и факты о собеседнике.
sections:
  - key: summary
    instruction: Кто собеседник, если назван, о чём говорили, главный вывод.
  - key: qa
    title: Вопросы и ответы
    instruction: Пары «Вопрос — краткий ответ» по порядку разговора, только самые содержательные.
  - key: quotes
    title: Яркие цитаты
    instruction: Дословные фразы собеседника из текста, которые стоит сохранить. Ничего не перефразируй.
  - key: facts
    title: Ключевые факты и цифры
    instruction: Названные собеседником факты, даты, числа, названия.
  - key: open_questions
    instruction: Что осталось выяснить или уточнить.
  - key: next_steps
