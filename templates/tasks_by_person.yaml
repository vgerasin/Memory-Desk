name: Задачи по людям
description: "Фокусный шаблон: поручения и обязательства, у каждого имя и срок."
focus: Нужны поручения и обязательства. Имя пиши, только если оно названо прямо; иначе «Не назначено».
sections:
  - key: summary
    instruction: Одна строка о том, что за встреча.
  - key: tasks
    instruction: "Каждый пункт в виде «Имя — что сделать (срок, если назван)», не больше 20."
