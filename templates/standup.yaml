name: Планёрка
description: "Короткая встреча команды: кто что сделал, что в работе, что мешает."
focus: Это короткая планёрка команды. Важны статусы по людям или направлениям и то, что блокирует работу, а не философия обсуждения.
sections:
  - key: summary
    instruction: Одна-три строки с итогом планёрки.
  - key: status
    title: Статус по направлениям
    instruction: "По одному пункту на человека или направление, если названо: что сделано и что в работе. Формат «Имя или направление — статус»."
  - key: blockers
    title: Что мешает
    instruction: Явно названные блокеры и просьбы о помощи.
  - key: tasks
    instruction: Только явные поручения на ближайшие дни.
  - key: next_steps
