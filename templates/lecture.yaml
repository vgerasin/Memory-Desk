name: Лекция или обучение
description: Тезисы, термины, примеры и вопросы для самостоятельного изучения.
focus: Это лекция или обучающее занятие, а не рабочая встреча. Решения и поручения не ищи, кроме явных домашних заданий.
sections:
  - key: summary
    instruction: Тема занятия и три-пять главных мыслей.
  - key: topics
  - key: theses
    title: Ключевые тезисы
    instruction: Основные утверждения лектора по порядку изложения.
  - key: terms
    title: Термины и определения
    instruction: Новые понятия в виде «Термин — определение, как его дал лектор».
  - key: examples
    title: Примеры и кейсы
    instruction: Приведённые примеры, истории, расчёты.
  - key: open_questions
    instruction: Вопросы, которые остались непонятными или заданы слушателями.
  - key: tasks
    instruction: Только явные домашние задания и то, что слушатели обещали изучить или сделать.
