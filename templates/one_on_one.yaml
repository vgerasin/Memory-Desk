name: Встреча один на один
description: "Разговор руководителя и сотрудника: обратная связь, развитие, договорённости до следующей встречи."
focus: Это разговор двоих, руководителя и сотрудника. Не оценивай людей от себя, фиксируй только сказанное.
sections:
  - key: summary
    instruction: Два-четыре тезиса о том, что обсудили.
  - key: topics
  - key: feedback
    title: Обратная связь
    instruction: "Что сказали друг другу о работе: что получается и что стоит изменить. Своими словами не оценивай, только то, что прозвучало."
  - key: growth
    title: Развитие и цели
    instruction: Планы на рост, обучение, нагрузку, ожидания от роли.
  - key: open_questions
  - key: tasks
    instruction: Обязательства каждой из сторон; ответственный — тот, кто прямо назван.
  - key: next_steps
    instruction: О чём договорились к следующей встрече.
