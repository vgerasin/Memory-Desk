name: Для руководителя на 5 строк
description: "Фокусный шаблон: не больше пяти коротких строк для руководителя."
focus: Заметка читается руководителем за полминуты. Без подробностей.
sections:
  - key: summary
    instruction: "Не больше пяти коротких строк: главный итог, ключевое решение, главный риск, что нужно от руководителя, ближайший шаг."
